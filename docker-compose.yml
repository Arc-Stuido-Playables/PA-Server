services:
  pa-server:
    build: .
    image: pa-server:latest
    container_name: pa-server
    restart: unless-stopped
    ports:
      # nginx on the host terminates HTTPS. For plain HTTP without nginx use "80:8080".
      - "127.0.0.1:8080:8080"
    environment:
      MAX_UPLOAD_MB: "100"
      # Uncomment to password-protect /list and /upload (playable links stay public):
      # ADMIN_USER: "arc"
      # ADMIN_PASSWORD: "change-me"
    volumes:
      - pa-data:/data

volumes:
  pa-data:
